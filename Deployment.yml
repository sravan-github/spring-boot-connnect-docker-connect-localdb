apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: springboot-app
  template:
    metadata:
      labels:
        app: springboot-app
    spec:
      containers:
        - name: springboot-container
          image: sravanscker/spring-boot-localdb:1.0
          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: springboot-config
            - secretRef:
                name: springboot-secret
